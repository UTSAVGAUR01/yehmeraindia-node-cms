<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b1d" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Account | Yeh Mera India</title>
    <link rel="stylesheet" href="/account.css" />
  </head>
  <body>
    <main class="account-shell">
      <a class="brand" href="/">Yeh Mera India</a>
      <section class="account-card">
        <p class="eyebrow" id="eyebrow">Secure account access</p>
        <h1 id="title">Sign in to continue.</h1>
        <p class="intro" id="intro">Use your password. If two-factor login is enabled, a one-time code will be sent to your email.</p>
        <div id="notice" class="notice" hidden></div>
        <div id="error" class="error" hidden></div>

        <form id="signin-form" data-mode="signin">
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Sign in</button>
          <button type="button" class="link-button" data-switch="forgot">Forgot password?</button>
          <p>New to Yeh Mera India? <button type="button" class="inline" data-switch="signup">Create account</button></p>
        </form>

        <form id="signup-form" data-mode="signup" hidden>
          <label>Your name<input name="name" autocomplete="name" required maxlength="150" /></label>
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" required /></label>
          <small>Use at least 10 characters with uppercase, lowercase and a number.</small>
          <label class="check"><input name="enableTwoFactor" type="checkbox" /> Send an email OTP every time I sign in</label>
          <button type="submit">Create account and send OTP</button>
          <p>Already registered? <button type="button" class="inline" data-switch="signin">Sign in</button></p>
        </form>

        <form id="otp-form" data-mode="otp" hidden>
          <label>One-time code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required /></label>
          <button type="submit">Verify code</button>
          <button type="button" class="link-button" data-switch="signin">Return to sign in</button>
        </form>

        <form id="forgot-form" data-mode="forgot" hidden>
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <button type="submit">Send password-reset link</button>
          <button type="button" class="link-button" data-switch="signin">Return to sign in</button>
        </form>

        <form id="reset-form" data-mode="reset" hidden>
          <label>New password<input name="password" type="password" autocomplete="new-password" minlength="10" required /></label>
          <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required /></label>
          <button type="submit">Reset password</button>
        </form>

        <section id="security-panel" hidden>
          <h2>Login security</h2>
          <p id="security-status"></p>
          <form id="security-form">
            <label>Current password<input name="password" type="password" autocomplete="current-password" required /></label>
            <label class="check"><input name="enabled" type="checkbox" /> Require an email OTP after password sign-in</label>
            <button type="submit">Save security setting</button>
          </form>
          <button id="continue-button" type="button" class="secondary">Continue to website</button>
        </section>
      </section>
    </main>
    <script src="/account.js" defer></script>
  </body>
</html>
