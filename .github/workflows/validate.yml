name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check server and browser JavaScript syntax
        run: |
          node --check index.js
          node --check server/footer-email-preload.js
          node --check server/member-studio-preload.js
          node --check server/profile-preload.js
          node --check server/security-auth-preload.js
          node --check public/account.js
          node --check public/studio.js
          node --check public/profile-enhancements.js
          node --check public/auth-redirect.js
          node --check public/member-studio-link.js

      - name: Build production frontend
        run: npm run build
