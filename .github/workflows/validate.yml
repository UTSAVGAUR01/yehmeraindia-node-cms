name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check server and browser JavaScript syntax
        run: |
          node --check index.js
          node --check server/security-edge-preload.js
          node --check server/viewer-verification-preload.js
          node --check server/viewer-message-gate-preload.js
          node --check server/bilingual-place-preload.js
          node --check server/place-research-normalize-preload.js
          node --check server/footer-email-preload.js
          node --check server/member-studio-preload.js
          node --check server/profile-preload.js
          node --check server/security-auth-preload.js
          node --check server/social-footer-preload.js
          node --check server/work-description-ai-preload.js
          node --check server/carousel-settings-preload.js
          node --check public/map-bootstrap.js
          node --check public/network-resilience.js
          node --check public/ymi-sw.js
          node --check public/india-vector-map.js
          node --check public/session-verification.js
          node --check public/account-verification-hint.js
          node --check public/india-bilingual-index.js
          node --check public/account.js
          node --check public/studio.js
          node --check public/profile-enhancements.js
          node --check public/profile-navigation.js
          node --check public/author-social-profile.js
          node --check public/site-footer.js
          node --check public/author-follow.js
          node --check public/site-settings.js
          node --check public/admin-site-settings-link.js
          node --check public/work-description-ai.js
          node --check public/auth-redirect.js
          node --check public/admin-studio-enhancements.js
          node --check public/homepage-carousels.js

      - name: Build production frontend
        run: npm run build

      - name: Verify React DOM, carousel, profile, catalogue AI and vector map assets
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -size +0c -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' -size +0c -print -quit)"
          grep -Eq '/assets/index-[^" ]+\.js' dist/index.html
          grep -Eq '/assets/index-[^" ]+\.css' dist/index.html
          grep -q 'id="ymi-global-footer"' dist/index.html
          grep -q '/site-footer.js' dist/index.html
          grep -q '/network-resilience.js' dist/index.html
          grep -q '/profile-navigation.js' dist/index.html
          grep -q '/homepage-carousels.js' dist/index.html
          grep -q '/homepage-carousels.css' dist/index.html
          grep -q '/map-bootstrap.js' dist/index.html
          grep -q '/india-vector-map.js' dist/index.html
          grep -q '/india-vector-map.css' dist/index.html
          grep -q 'maplibre-gl@5.24.0' dist/index.html
          grep -q 'serviceWorker.register("/ymi-sw.js"' public/network-resilience.js
          grep -q 'tiles.openfreemap.org/styles/bright' public/india-vector-map.js
          grep -q 'tiles.openfreemap.org/styles/liberty' public/india-vector-map.js
          grep -q 'name:en' public/india-vector-map.js
          grep -q 'name:hi' public/india-vector-map.js
          grep -q 'name:latin' public/india-vector-map.js
          ! grep -q '\["get", "name"\]' public/india-vector-map.js
          grep -q 'maxZoom: 20' public/india-vector-map.js
          grep -q 'ymi-india-boundary-halo' public/india-vector-map.js
          grep -q 'line-color": "#17120c"' public/india-vector-map.js
          grep -q 'ymi-vector-map-pending' public/india-vector-map.css
          grep -q 'ymi-vector-map-fallback' public/india-vector-map.css
          grep -q 'ymi-vpn-shell-15' public/ymi-sw.js
          grep -q '"/profile-navigation.js"' public/ymi-sw.js
          grep -q '"/homepage-carousels.js"' public/ymi-sw.js
          grep -q '"/homepage-carousels.css"' public/ymi-sw.js
          grep -q 'server/carousel-settings-preload.js' index.js
          grep -q '/api/carousel-settings' server/carousel-settings-preload.js
          grep -q '/api/admin/carousel-settings' server/carousel-settings-preload.js
          grep -q 'interval_seconds' server/carousel-settings-preload.js
          grep -q '.work-section .book-grid,' public/homepage-carousels.css
          grep -q '.work-section .play-event-grid,' public/homepage-carousels.css
          grep -q '.journal-preview .post-grid {' public/homepage-carousels.css
          grep -q 'display: flex !important' public/homepage-carousels.css
          grep -q 'grid-template-columns: minmax(220px, 36%)' public/homepage-carousels.css
          grep -q 'overflow-x: auto !important' public/homepage-carousels.css
          grep -q '.journal-preview .post-grid > .post-card > img {' public/homepage-carousels.css
          grep -q 'object-fit: contain !important' public/homepage-carousels.css
          grep -q 'object-position: center center !important' public/homepage-carousels.css
          grep -q 'flex: 0 0 calc(100% - 12px) !important' public/homepage-carousels.css
          grep -q 'grid-template-columns: 1fr !important' public/homepage-carousels.css
          grep -q 'height: clamp(190px, 58vw, 280px) !important' public/homepage-carousels.css
          grep -q '@media (max-width: 480px)' public/homepage-carousels.css
          grep -q 'intervalSeconds = 5' public/homepage-carousels.js
          grep -q 'intervalSeconds \* 1000' public/homepage-carousels.js
          grep -q 'Save carousel timing' public/homepage-carousels.js
          grep -q '/api/admin/carousel-settings' public/homepage-carousels.js
          grep -q 'window.setInterval(() => scan(), 1500)' public/homepage-carousels.js
          grep -q 'prefers-reduced-motion' public/homepage-carousels.js
          grep -q 'window.location.assign("/studio.html")' public/profile-navigation.js
          grep -q 'data-ymi-profile-entry' public/profile-navigation.js
          grep -q 'viewer.*author.*admin' public/profile-navigation.js
          grep -q '/api/auth/me' public/profile-navigation.js
          grep -q 'nameEnglish' server/bilingual-place-preload.js
          grep -q 'bilingual-v3' server/bilingual-place-preload.js
          ! grep -q '/india-map-labels.js' dist/index.html
          ! grep -q '/india-map-labels.css' dist/index.html
          grep -q 'getElementById("ymi-global-footer")' public/site-footer.js
          ! grep -q 'MutationObserver' public/site-footer.js
          ! grep -q 'main footer' public/site-footer.js
          grep -q '/admin-studio-enhancements.js' dist/index.html
          grep -q '/admin-studio-enhancements.css' dist/index.html
          grep -q '/api/admin/ai/work-description' public/admin-studio-enhancements.js
          grep -q '/api/admin/rewrite' public/admin-studio-enhancements.js
          grep -q 'Write book description with AI' public/admin-studio-enhancements.js
          grep -q 'Write play description with AI' public/admin-studio-enhancements.js
          grep -q 'Format and writing style' public/admin-studio-enhancements.js
          grep -q 'Review before replacing' public/admin-studio-enhancements.js
          grep -q 'Keep original' public/admin-studio-enhancements.js
          grep -q 'Replace original' public/admin-studio-enhancements.js
          grep -q '<h2>My profile</h2>' public/studio.html
          grep -q 'id="profile-name-form"' public/studio.html
          grep -q 'id="profile-password-form"' public/studio.html
          ! grep -q '/member-studio-link.js' dist/index.html
          ! grep -q '/admin-profile-link.css' dist/index.html
          test ! -e public/member-studio-link.js
          test ! -e public/admin-profile-link.css
          ! grep -Eq '(frontend-recovery|work-details|author-follow|work-description-ai|india-bilingual-index|admin-site-settings-link)\.js' dist/index.html
