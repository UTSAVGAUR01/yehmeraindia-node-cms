name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check server and browser JavaScript syntax
        run: |
          node --check index.js
          node --check server/security-edge-preload.js
          node --check server/viewer-verification-preload.js
          node --check server/viewer-message-gate-preload.js
          node --check server/bilingual-place-preload.js
          node --check server/place-research-normalize-preload.js
          node --check server/footer-email-preload.js
          node --check server/member-studio-preload.js
          node --check server/profile-preload.js
          node --check server/security-auth-preload.js
          node --check server/social-footer-preload.js
          node --check server/work-description-ai-preload.js
          node --check public/map-bootstrap.js
          node --check public/network-resilience.js
          node --check public/ymi-sw.js
          node --check public/india-vector-map.js
          node --check public/session-verification.js
          node --check public/account-verification-hint.js
          node --check public/india-bilingual-index.js
          node --check public/account.js
          node --check public/studio.js
          node --check public/profile-enhancements.js
          node --check public/author-social-profile.js
          node --check public/site-footer.js
          node --check public/author-follow.js
          node --check public/site-settings.js
          node --check public/admin-site-settings-link.js
          node --check public/work-description-ai.js
          node --check public/auth-redirect.js
          node --check public/admin-studio-enhancements.js

      - name: Build production frontend
        run: npm run build

      - name: Verify React-owned DOM, studio controls and single vector map assets
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -size +0c -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' -size +0c -print -quit)"
          grep -Eq '/assets/index-[^" ]+\.js' dist/index.html
          grep -Eq '/assets/index-[^" ]+\.css' dist/index.html
          grep -q 'id="ymi-global-footer"' dist/index.html
          grep -q '/site-footer.js' dist/index.html
          grep -q '/network-resilience.js' dist/index.html
          grep -q '/map-bootstrap.js' dist/index.html
          grep -q '/india-vector-map.js' dist/index.html
          grep -q '/india-vector-map.css' dist/index.html
          grep -q 'maplibre-gl@5.24.0' dist/index.html
          grep -q 'serviceWorker.register("/ymi-sw.js"' public/network-resilience.js
          grep -q 'tiles.openfreemap.org/styles/bright' public/india-vector-map.js
          grep -q 'tiles.openfreemap.org/styles/liberty' public/india-vector-map.js
          grep -q 'name:en' public/india-vector-map.js
          grep -q 'name:hi' public/india-vector-map.js
          grep -q 'name:latin' public/india-vector-map.js
          ! grep -q '\["get", "name"\]' public/india-vector-map.js
          grep -q 'maxZoom: 20' public/india-vector-map.js
          grep -q 'ymi-india-boundary-halo' public/india-vector-map.js
          grep -q 'line-color": "#17120c"' public/india-vector-map.js
          grep -q 'ymi-vector-map-pending' public/india-vector-map.css
          grep -q 'ymi-vector-map-fallback' public/india-vector-map.css
          grep -q 'ymi-vpn-shell-9' public/ymi-sw.js
          grep -q 'nameEnglish' server/bilingual-place-preload.js
          grep -q 'bilingual-v3' server/bilingual-place-preload.js
          ! grep -q '/india-map-labels.js' dist/index.html
          ! grep -q '/india-map-labels.css' dist/index.html
          grep -q 'getElementById("ymi-global-footer")' public/site-footer.js
          ! grep -q 'MutationObserver' public/site-footer.js
          ! grep -q 'main footer' public/site-footer.js
          grep -q '/admin-studio-enhancements.js' dist/index.html
          grep -q '/admin-studio-enhancements.css' dist/index.html
          grep -q '/api/admin/rewrite' public/admin-studio-enhancements.js
          grep -q 'Rewrite book description with AI' public/admin-studio-enhancements.js
          grep -q 'Rewrite play description with AI' public/admin-studio-enhancements.js
          grep -q 'Rewrite video description with AI' public/admin-studio-enhancements.js
          ! grep -q '/member-studio-link.js' dist/index.html
          ! grep -q '/admin-profile-link.css' dist/index.html
          test ! -e public/member-studio-link.js
          test ! -e public/admin-profile-link.css
          ! grep -Eq '(frontend-recovery|work-details|author-follow|work-description-ai|india-bilingual-index|admin-site-settings-link)\.js' dist/index.html
